name: v3 check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: v3-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgresql://ati_v3:ati_v3_ci_only@127.0.0.1:5432/ati_v3
  RUNTIME_MODE: sandbox
  CHAT_ADMIN_EMAIL: ci-browser@localhost.test
  CHAT_ADMIN_PASSWORD: ci-browser-test-password-2026

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ati_v3
          POSTGRES_PASSWORD: ati_v3_ci_only
          POSTGRES_DB: ati_v3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ati_v3 -d ati_v3"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:v3
      - run: npm run check

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ati_v3
          POSTGRES_PASSWORD: ati_v3_ci_only
          POSTGRES_DB: ati_v3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ati_v3 -d ati_v3"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:v3
      - run: npm run admin:provision:v3
      - name: Install Chromium and verify runner libraries
        run: |
          npx playwright install chromium
          if ! node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close()'; then
            npx playwright install-deps chromium
            node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser = await chromium.launch(); await browser.close()'
          fi
      - run: npm run test:browser:v3
