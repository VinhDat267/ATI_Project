# Legacy infrastructure template. Current G1 uses: npm run db:up:g1
# See compose.g1.yaml for dedicated ports/volume; do not reset existing data.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wap
      POSTGRES_PASSWORD: wap
      POSTGRES_DB: wap
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wap"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
